providers:
  apt:
    prerequisites:
      - Debian-family host with configured APT repositories, network access and administration privileges.
      - Package name is git. Exact version is suite-specific; unqualified apt install git selects the current candidate, not upstream 2.56.0. See evidence/linux-install-scope.md.
      - Ubuntu jammy, noble and plucky amd64 indexes were captured on 2026-10-20. Debian suite indexes and Ubuntu arm64 indexes were not reachable from this worktree (HTTP 403).
    evidence:
      - kind: capture
        source: courses/it/git-fundamentals/tool/evidence/linux-package-indexes.json
        version: 2.56.0
        date: 2026-10-20
      - kind: capture
        source: courses/it/git-fundamentals/tool/evidence/linux-install-scope.md
        version: 2.56.0
        date: 2026-10-20
      - kind: primary_source
        source: https://raw.githubusercontent.com/git/git/v2.56.0/README.md
        version: 2.56.0
        date: 2026-10-20
    packages:
      - name: git
        package_name: git
        evidence:
          - kind: capture
            source: courses/it/git-fundamentals/tool/evidence/linux-package-indexes.json
            version: 2.56.0
            date: 2026-10-20
          - kind: capture
            source: courses/it/git-fundamentals/tool/evidence/apt-noble-amd64-git.stanza
            version: 1:2.43.0-1ubuntu7
            date: 2026-10-20
  yum:
    prerequisites:
      - Red Hat-family host with dnf or yum, configured repositories and administration privileges.
      - Package name is git. Exact NEVRA was not read from a live repomd in this worktree; see evidence/linux-install-scope.md capture limits. Do not invent a version from Ubuntu apt rows.
    evidence:
      - kind: capture
        source: courses/it/git-fundamentals/tool/evidence/linux-install-scope.md
        version: 2.56.0
        date: 2026-10-20
      - kind: capture
        source: courses/it/git-fundamentals/tool/evidence/linux-package-indexes.json
        version: 2.56.0
        date: 2026-10-20
      - kind: primary_source
        source: https://raw.githubusercontent.com/git/git/v2.56.0/README.md
        version: 2.56.0
        date: 2026-10-20
    packages:
      - name: git
        package_name: git
        evidence:

providers:
  apt:
    prerequisites:
      - Debian-family host with APT administration privileges; apt-transport-https (may be a dummy package), ca-certificates, curl and gpg (or gnupg).
      - Configure the Kubernetes apt repository for minor v1.37 at https://pkgs.k8s.io/core:/stable:/v1.37/deb/ with its Release.key keyring under /etc/apt/keyrings/kubernetes-apt-keyring.gpg. A different minor replaces v1.37 in that path.
      - For a client only, install kubectl from that repository. For a cluster node, install kubelet, kubeadm and kubectl together and hold their versions (apt-mark hold) so unattended upgrades cannot skew them.
      - Exact 1.37.1 selection needs the repository candidate for that patch; unqualified install selects the current candidate in the configured minor repository. See evidence/linux-install-scope.md.
    evidence:
      - kind: primary_source
        source: https://raw.githubusercontent.com/kubernetes/website/6f1e5a9b1e7dce93a8afc425b41d8653e71e7f1e/content/en/docs/tasks/tools/install-kubectl-linux.md
        version: 1.37.1
        date: 2026-10-20
      - kind: primary_source
        source: https://raw.githubusercontent.com/kubernetes/website/6f1e5a9b1e7dce93a8afc425b41d8653e71e7f1e/content/en/docs/setup/production-environment/tools/kubeadm/install-kubeadm.md
        version: 1.37.1
        date: 2026-10-20
      - kind: capture
        source: courses/it/kubernetes-fundamentals/tool/evidence/linux-install-scope.md
        version: 1.37.1
        date: 2026-10-20
    packages:
      - name: kubectl
        package_name: kubectl
        repository: https://pkgs.k8s.io/core:/stable:/v1.37/deb/
        evidence:
          - kind: primary_source

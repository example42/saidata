  helm:
    prerequisites:
      - "not applicable: no official chart for Kubernetes itself. The Kubernetes project documents cluster bootstrap with kubeadm (init, join, CNI add-on), not a Helm chart that installs the control plane. Charts that claim to install Kubernetes are third party and are not offered here."
    evidence:
      - kind: primary_source
        source: https://raw.githubusercontent.com/kubernetes/website/6f1e5a9b1e7dce93a8afc425b41d8653e71e7f1e/content/en/docs/setup/production-environment/tools/kubeadm/create-cluster-kubeadm.md
        version: 1.37.1
        date: 2026-10-20
      - kind: capture
        source: courses/it/kubernetes-fundamentals/tool/evidence/linux-install-scope.md
        version: 1.37.1
        date: 2026-10-20
    charts: []
  kubernetes:
    prerequisites:
      - A Linux host (control-plane or worker). kubeadm control-plane bootstrapping is the Linux cluster Target.
      - Install matching kubeadm, kubelet and kubectl from the pkgs.k8s.io minor repository (v1.37) or another documented method, plus a container runtime kubeadm can detect.
      - Initialize with kubeadm init, then install a CNI-based Pod network add-on before expecting Pods other than those on the control plane to schedule. CNI choice is a prerequisite (kubeadm is CNI-agnostic; pick and apply one add-on from its project docs). Join workers with the kubeadm join command printed by init (token and discovery-token-ca-cert-hash).
      - Helm is not used to install Kubernetes itself; see providers.helm.
    evidence:
      - kind: primary_source
        source: https://raw.githubusercontent.com/kubernetes/kubernetes/v1.37.1/cmd/kubeadm/app/constants/constants.go
        version: 1.37.1
        date: 2026-10-18
      - kind: primary_source
        source: https://raw.githubusercontent.com/kubernetes/website/6f1e5a9b1e7dce93a8afc425b41d8653e71e7f1e/content/en/docs/setup/production-environment/tools/kubeadm/create-cluster-kubeadm.md
        version: 1.37.1

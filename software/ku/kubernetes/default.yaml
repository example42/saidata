            version: 1.37.1
            date: 2026-10-20
  yum:
    prerequisites:
      - Red Hat-family host with yum or dnf and administration privileges.
      - Configure the Kubernetes yum repository for minor v1.37 at https://pkgs.k8s.io/core:/stable:/v1.37/rpm/ with gpgcheck=1 and gpgkey https://pkgs.k8s.io/core:/stable:/v1.37/rpm/repodata/repomd.xml.key. A different minor replaces v1.37 in that path.
      - For a client only, install kubectl. For a cluster node, install kubelet, kubeadm and kubectl with --disableexcludes=kubernetes when the repo excludes those packages.
      - Exact 1.37.1 selection needs the repository candidate for that patch; see evidence/linux-install-scope.md.

providers:
  apt:
    prerequisites:
      - Debian-family host with APT administration privileges; ca-certificates, curl and gpg.
      - Add the PGDG signing key (https://www.postgresql.org/media/keys/ACCC4CF8.asc) and the apt.postgresql.org repository for the release codename (noble-pgdg).
      - Select the exact release with postgresql-18=18.6-1.pgdg24.04+2 and postgresql-client-18 at the same version. The distribution packages of Ubuntu 24.04 carry PostgreSQL 16, not 18.
      - The package creates the cluster 18/main; start it with pg_ctlcluster 18 main start or the postgresql service.
    evidence:
      - kind: capture
        source: courses/it/postgresql-fundamentals/tool/evidence/apt-noble-amd64-postgresql.stanza
        version: "18.6"
        date: 2026-10-24
    packages:
      - name: postgresql-18
        package_name: postgresql-18
        repository: https://apt.postgresql.org/pub/repos/apt
        evidence:
          - kind: capture
            source: courses/it/postgresql-fundamentals/tool/evidence/apt-noble-amd64-postgresql.stanza
            version: "18.6"
            date: 2026-10-24
      - name: postgresql-client-18
        package_name: postgresql-client-18
        repository: https://apt.postgresql.org/pub/repos/apt
        evidence:
          - kind: capture
            source: courses/it/postgresql-fundamentals/tool/evidence/apt-noble-amd64-postgresql.stanza
            version: "18.6"
            date: 2026-10-24
  brew:
    prerequisites:
      - Homebrew on macOS.
      - The versioned formula postgresql@18 follows the 18 branch and installs the newest 18.x release it carries, which may be newer than 18.6.
    evidence:
      - kind: primary_source
        source: https://raw.githubusercontent.com/Homebrew/homebrew-core/b7c254884d25085e4685ba7e7ddb6f5ecd86c14f/Formula/p/postgresql@18.rb
        version: "18.6"
        date: 2026-10-24
    packages:
      - name: postgresql@18
        package_name: postgresql@18
        repository: https://github.com/Homebrew/homebrew-core
        evidence:
          - kind: primary_source
            source: https://raw.githubusercontent.com/Homebrew/homebrew-core/b7c254884d25085e4685ba7e7ddb6f5ecd86c14f/Formula/p/postgresql@18.rb
            version: "18.6"
            date: 2026-10-24
  docker:
    prerequisites:
      - Docker, or another engine that can pull from Docker Hub.
      - The official Docker Official Image postgres initialises a cluster on first start from POSTGRES_PASSWORD; pin by digest. The index digest below is the 18.6 tag.
    evidence:
      - kind: capture
        source: courses/it/postgresql-fundamentals/tool/evidence/docker-index-18.6.json
        version: "18.6"
        date: 2026-10-24
    containers:
      - name: postgres
        image: postgres
        tag: "18.6"
        registry: docker.io
        evidence:
          - kind: capture
            source: courses/it/postgresql-fundamentals/tool/evidence/docker-index-18.6.json
            version: "18.6"
            date: 2026-10-24

  yum:
    prerequisites:
      - Rocky Linux or AlmaLinux 8 or 9 as documented by the Redis RPM guide; packaging repository additionally claims RHEL 8/9 compatibility.
      - "x86_64 or aarch64: 8.2.1-1 is listed for both architectures in each 8/9 repository."
      - Administration privileges, curl, rpm and yum; systemd for the documented service lifecycle.
      - Configure the matching rockylinux8 or rockylinux9 Redis repository with gpgcheck=1 and import the Redis GPG key.
      - Major version 10 is supported by current packaging, but its captured repository has no Redis 8.2.1 package; do not use this 8.2.1 method on 10.
    evidence:
      - kind: primary_source
        source: https://raw.githubusercontent.com/redis/docs/9f080672f7ca6f9cc0e8bbec5b138047ccb152ee/content/operate/oss_and_stack/install/install-stack/rpm.md

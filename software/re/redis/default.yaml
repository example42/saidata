providers:
  docker:
    prerequisites:
      - Docker installed on Linux, macOS, or Windows. On Windows, Docker must be configured for Linux containers; this is Docker on Windows, not a native Windows Redis build.
      - Pull by index digest redis@sha256:5fa2edb1e408fa8235e6db8fab01d1afaaae96c9403ba67b70feceb8661e8621 to select Redis 8.2.1; the redis:8.2.1 tag is mutable.
    evidence:
      - kind: primary_source
        source: https://raw.githubusercontent.com/redis/docs/9f080672f7ca6f9cc0e8bbec5b138047ccb152ee/content/operate/oss_and_stack/install/install-stack/docker.md
        version: 8.2.1
        date: 2026-10-14
    containers:
      - name: redis
        image: redis
        tag: 8.2.1
        registry: docker.io
        ports:
          - 6379/tcp
        volumes:
          - /data
        evidence:
          - kind: primary_source
            source: https://raw.githubusercontent.com/docker-library/official-images/9940a91d1c73b8698cb8866b8ac04d40c7b1948c/library/redis
            version: 8.2.1
            date: 2026-10-14
  brew:
    prerequisites:
      - macOS with Homebrew installed. Intel keeps binaries under /usr/local/bin, Apple silicon under /opt/homebrew/bin; add the Homebrew bin directory to PATH.
      - The formula always installs the latest Redis Open Source release; it cannot pin 8.2.1. Use the Docker method for 8.2.1.
    evidence:
      - kind: primary_source
        source: https://raw.githubusercontent.com/redis/docs/88f8433a556c27490f362416b992dd73686e559f/content/operate/oss_and_stack/install/install-stack/homebrew.md
        version: 8.2.1
        date: 2026-10-14
    packages:
      - name: redis
        package_name: redis

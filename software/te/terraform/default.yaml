providers:
  apt:
    prerequisites:
      - Debian-family host with APT administration privileges; ca-certificates, curl and gpg.
      - Add the HashiCorp signing key under /usr/share/keyrings and the apt.releases.hashicorp.com repository for the release codename.
      - Select the exact release with terraform=1.14.9-1; an unqualified install takes the newest release the repository carries, which is newer than 1.14.9.
    evidence:
      - kind: capture
        source: courses/it/terraform-fundamentals/tool/evidence/apt-noble-amd64-terraform.stanza
        version: 1.14.9
        date: 2026-10-24
    packages:
      - name: terraform
        package_name: terraform
        repository: https://apt.releases.hashicorp.com
        evidence:
          - kind: capture
            source: courses/it/terraform-fundamentals/tool/evidence/apt-noble-amd64-terraform.stanza
            version: 1.14.9
            date: 2026-10-24
  brew:
    prerequisites:
      - Homebrew on macOS.
      - The hashicorp/tap tap installs the newest release it publishes; it does not pin 1.14.9. Verify the installed version with terraform version.
    evidence:
      - kind: primary_source
        source: https://raw.githubusercontent.com/hashicorp/homebrew-tap/6bfab853edc694e3801926b72446d57396f4c06c/Formula/terraform.rb
        version: 1.14.9
        date: 2026-10-24
    packages:
      - name: terraform
        package_name: hashicorp/tap/terraform
        repository: https://github.com/hashicorp/homebrew-tap
        evidence:
          - kind: primary_source
            source: https://raw.githubusercontent.com/hashicorp/homebrew-tap/6bfab853edc694e3801926b72446d57396f4c06c/Formula/terraform.rb
            version: 1.14.9
            date: 2026-10-24
  binary:
    prerequisites:
      - Download the zip for the platform from releases.hashicorp.com, verify it against the signed SHA256SUMS file, and place the terraform executable on PATH.
      - This is the documented manual path for Windows; the Windows page offers no package manager.
    evidence:
      - kind: primary_source
        source: https://releases.hashicorp.com/terraform/1.14.9/terraform_1.14.9_SHA256SUMS
        version: 1.14.9
        date: 2026-10-24
    packages:
      - name: terraform-windows-amd64
        package_name: terraform_1.14.9_windows_amd64.zip
        repository: https://releases.hashicorp.com/terraform/1.14.9/
        evidence:
          - kind: primary_source
            source: https://releases.hashicorp.com/terraform/1.14.9/
            version: 1.14.9
            date: 2026-10-24
  docker:
    prerequisites:
      - Docker, or another engine that can pull from Docker Hub.
      - HashiCorp publishes hashicorp/terraform on Docker Hub; the image runs terraform as its entrypoint, so arguments are passed after the image name.
      - Pin by digest. The index digest below is the 1.14.9 tag and carries linux amd64, arm64, 386 and arm/v6 images.
    evidence:
      - kind: capture
        source: courses/it/terraform-fundamentals/tool/evidence/docker-index-1.14.9.json
        version: 1.14.9
        date: 2026-10-24
    containers:
      - name: terraform
        image: hashicorp/terraform
        tag: 1.14.9
        registry: docker.io
        evidence:
          - kind: capture
            source: courses/it/terraform-fundamentals/tool/evidence/docker-index-1.14.9.json
            version: 1.14.9
            date: 2026-10-24
